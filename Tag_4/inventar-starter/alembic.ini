[alembic]
script_location = backend/migrations
# Im Docker-Container heißt der DB-Host "db" (lokal außerhalb von Docker: localhost).
# env.py überschreibt die URL mit den Werten aus .env, falls gesetzt.
sqlalchemy.url = postgresql+psycopg://appuser:apppass@db:5432/appdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
